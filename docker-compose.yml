services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: kkutu-test-pg
      POSTGRES_DB: main
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing: during first-boot init the temp server
      # only listens on the unix socket, so a socket-based check passes too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d main"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  game:
    build: .
    image: kkutu-app:latest
    command: ["node", "lib/Game/cluster.js", "0", "1"]
    environment:
      REDIS_URL: redis://redis:6379
      TZ: Asia/Seoul
    volumes:
      - ./deploy/global.docker.json:/app/Server/lib/sub/global.json:ro
      - ./deploy/auth.docker.json:/app/Server/lib/sub/auth.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8496:8496"
    healthcheck:
      # Master listens on MAIN_PORTS[0] only after PG is ready, so this gates web correctly.
      # Port is read from the mounted global.json (same file the app uses) so it can't drift.
      test: ["CMD", "node", "-e", "const p=require('/app/Server/lib/sub/global.json').MAIN_PORTS[0];const s=require('net').connect(p,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build: .
    image: kkutu-app:latest
    command: ["node", "lib/Web/cluster.js", "1"]
    environment:
      REDIS_URL: redis://redis:6379
      KKT_SV_NAME: TEST
      TZ: Asia/Seoul
    volumes:
      - ./deploy/global.docker.json:/app/Server/lib/sub/global.json:ro
      - ./deploy/auth.docker.json:/app/Server/lib/sub/auth.json:ro
    depends_on:
      # web re-dials game automatically after a disconnect, but starting it
      # after game avoids an empty server list right after boot.
      game:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
